<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f1f3f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e15" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="FlexyDay" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applies the stored theme before first paint so the page does not flash.
      // No attribute means follow the system preference.
      try {
        const stored = localStorage.getItem("flexyday-theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        // Storage unavailable: fall through and follow the system.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
